name: Weekly digest

on:
  schedule:
    - cron: "0 6 * * 1"     # every Monday 06:00 UTC
  workflow_dispatch:         # "Run workflow" button for manual runs
    inputs:
      send_email:
        description: "Send the email to subscribers"
        type: boolean
        default: true
  push:
    branches: [main]
    paths: ["site/**"]       # redeploy the site when the app itself changes

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build this week's issue
        if: github.event_name != 'push'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          SUBSCRIBERS: ${{ secrets.SUBSCRIBERS }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.send_email }}" != "true" ]; then
            python pipeline/run_weekly.py --no-email
          else
            python pipeline/run_weekly.py
          fi

      - name: Commit issue data
        if: github.event_name != 'push'
        run: |
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add site/data site/feed.xml
          git commit -m "Issue $(date -u +%F)" || echo "nothing to commit"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
